<!DOCTYPE html>
<html>
<head>
  <title>Add Call - Airmen CRM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="pagehead">
    <h2>Add Call</h2>
    <div class="crumb"><a href="/index.html">Home</a> &gt; Add Call</div>
  </div>

  <div class="content">
    <div class="three empty" id="three">

      <div class="panel">
        <h3>Company Details</h3>
        <select id="company" onchange="showCompany()">
          <option value="">Select Company</option>
        </select>
        <table class="details" id="companyInfo"></table>
      </div>

      <div>
        <div class="panel">
          <h3>Model Details</h3>
          <select id="model"><option value="">Select Model</option></select>
        </div>

        <div class="panel">
          <h3>Call Details</h3>
          <div class="field">
            <textarea id="problem" rows="6" placeholder="Nature of Problem"></textarea>
          </div>
          <div class="field">
            <select id="visit">
              <option value="">Nature of Visit</option>
            <option>AMC</option>
            <option>Warranty</option>
            <option>Goodwill</option>
            <option>Chargeable</option>
            <option>AMC/Payment Followup</option>
            </select>
          </div>
          <div class="field">
            <select id="priority">
              <option>Low Priority</option>
              <option>Medium Priority</option>
              <option>High Priority</option>
            </select>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3>Technician Details</h3>
        <div class="field"><input type="date" id="callDate"></div>
        <select id="technician"><option value="">Select Technician</option></select>
      </div>

    </div>

    <p id="saveRow" style="display:none"><button class="btn" onclick="saveCall()">Save Call</button></p>
    <p id="msg"></p>
  </div>

  <script src="/layout.js"></script>
  <script>
    let customers = [];

    function callId(id) {
      return 'CALL-' + String(id).padStart(5, '0');
    }

    function fillSelect(id, rows) {
      const select = document.getElementById(id);
      for (const r of rows) {
        const option = document.createElement('option');
        option.value = r.id;
        option.textContent = r.name;
        select.appendChild(option);
      }
    }

    async function loadLists() {
      customers = await (await fetch('/api/customers')).json();
      fillSelect('company', customers);
      fillSelect('model', await (await fetch('/api/models')).json());
      fillSelect('technician', await (await fetch('/api/technicians')).json());
    }

    function showCompany() {
      const table = document.getElementById('companyInfo');
      table.innerHTML = '';
      const chosen = document.getElementById('company').value;
      const c = customers.find(x => String(x.id) === chosen);
      document.getElementById('three').classList.toggle('empty', !c);
document.getElementById('saveRow').style.display = c ? '' : 'none';
if (!c) return;

      const rows = [
        ['Company Name', c.name],
        ['Contact Person', c.contact_person],
        ['Contact Designation', c.contact_designation],
        ['Address', c.address],
        ['Phone', c.phone],
        ['Phone', c.phone2]
      ];
      for (const [label, value] of rows) {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.textContent = label;
        const td = document.createElement('td');
        td.textContent = value || '';
        tr.appendChild(th);
        tr.appendChild(td);
        table.appendChild(tr);
      }
    }

    async function saveCall() {
      const msg = document.getElementById('msg');
      const res = await fetch('/api/calls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: document.getElementById('company').value,
          model_id: document.getElementById('model').value,
          technician_id: document.getElementById('technician').value,
          problem: document.getElementById('problem').value,
          nature_of_visit: document.getElementById('visit').value,
          priority: document.getElementById('priority').value,
          call_date: document.getElementById('callDate').value
        })
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error;
        return;
      }
      msg.textContent = 'Call saved. Call ID: ' + callId(data.id);

      document.getElementById('company').value = '';
      document.getElementById('model').value = '';
      document.getElementById('technician').value = '';
      document.getElementById('problem').value = '';
      document.getElementById('visit').value = '';
      document.getElementById('priority').value = 'Low Priority';
      showCompany();
    }

    document.getElementById('callDate').value = new Date().toLocaleDateString('en-CA');
    loadLists();
  </script>
</body>
</html>
