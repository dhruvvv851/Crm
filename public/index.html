<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Airmen CRM</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="header"></div>

  <div class="pagehead">
    <h2>Dashboard</h2>
    <div class="crumb"><a href="/index.html">Home</a> &gt; Dashboard</div>
  </div>

  <div class="content">
    <div class="cards">
      <div class="card"><div><div class="num" id="customers">0</div><div class="label">Total Customers</div></div><div class="spark" style="color:#18b9c4"></div></div>
      <div class="card"><div><div class="num" id="calls">0</div><div class="label">Total Calls</div></div><div class="spark" style="color:#f5a623"></div></div>
      <div class="card"><div><div class="num" id="pending">0</div><div class="label">Pending Calls</div></div><div class="spark" style="color:#3f3fb0"></div></div>
      <div class="card"><div><div class="num" id="technicians">0</div><div class="label">Total Technician</div></div><div class="spark" style="color:#6b1a1a"></div></div>
      <div class="card"><div><div class="num" id="models">0</div><div class="label">Total Model</div></div><div class="spark" style="color:#111"></div></div>
      <div class="card"><div><div class="num" id="parts">0</div><div class="label">Total Parts</div></div><div class="spark" style="color:#18b9c4"></div></div>
    </div>

    <div class="dash">
      <div>
        <div class="panel">
          <h3>Technician Location</h3>
          <select id="techSelect"><option value="">Select Technician</option></select>
        </div>
        <div class="panel">
          <h3>Recent calls</h3>
          <div id="activity"></div>
        </div>
      </div>

      <div>
        <div class="panel">
          <h3>Start/End Day - Total 0</h3>
          <p style="color:#8795a3">No data yet.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/layout.js"></script>
  <script>
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function localTime(t) {
      return new Date(t.replace(' ', 'T') + 'Z').toLocaleString();
    }
    function callId(id) {
      return 'CALL-' + String(id).padStart(5, '0');
    }

    const heights = [20, 35, 15, 40, 25, 45, 30, 18, 38];
    document.querySelectorAll('.spark').forEach(box => {
      for (const h of heights) {
        const s = document.createElement('span');
        s.style.height = h + 'px';
        box.appendChild(s);
      }
    });

    async function loadDashboard() {
      const res = await fetch('/api/dashboard');
      const d = await res.json();

      for (const key of ['customers', 'calls', 'pending', 'technicians', 'models', 'parts']) {
        document.getElementById(key).textContent = d[key];
      }

      const select = document.getElementById('techSelect');
      for (const t of d.technicianList) {
        const option = el('option', '', t.name);
        option.value = t.id;
        select.appendChild(option);
      }

      const box = document.getElementById('activity');
      if (d.recentCalls.length === 0) {
        box.textContent = 'No calls yet.';
        return;
      }
      for (const c of d.recentCalls) {
        const item = el('div', 'item');
        item.appendChild(el('div', '', '\u260E'));
        const text = el('div');
        text.appendChild(el('div', 'time', localTime(c.created_at)));
        text.appendChild(el('div', '', 'New Call Added for ' + c.customer));
        text.appendChild(el('div', '', 'Call ID : ' + callId(c.id)));
        item.appendChild(text);
        box.appendChild(item);
      }
    }
    loadDashboard();
  </script>
</body>
</html>
